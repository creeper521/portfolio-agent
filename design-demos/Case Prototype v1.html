<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>案例目录 · 工程成长档案 — HTML 原型</title>

<!--
  ════════════════════════════════════════════════════════════════════════
  Portfolio V1 Case — 高保真交互原型（huashu-design · Junior Designer pass）

  本文件验证 2026-07-28 设计 spec §5（前端交接 brief）的关键交互契约：
    · §5.1  独立规范路由 /cases 与 /cases/:slug，旧 /projects/{caseSlug} 重定向
    · §5.2  桌面导航明确区分「项目 / 案例」
    · §5.3  Case 目录：标题/摘要/类型/状态/贡献/关联项目 + 类型筛选
    · §5.4  Case 详情八段结构（背景→动作→判断→验证→结果→限制→证据→建议问题）
    · §5.5  Case → Agent 交接（caseSlug + source=CASE，可清除上下文）
    · §5.6  状态覆盖：加载/空/404/失败/重试/无证据/无建议问题/键盘/Reduced Motion

  视觉系统 1:1 复刻现有 frontend（tokens.css / base.css），不引入新风格：
    paper #f4eee4 · ink #201c17 · red #7a2e2a · rule #cdbfa9
    Georgia + Noto Serif SC 衬线 · IBM Plex Mono 元数据 · 发丝线分隔无阴影

  数据：真实 Bundle（49 Case / contentVersion 2026-07-27.1），非编造。
  ════════════════════════════════════════════════════════════════════════
-->

<style>
/* ─────────────────────── 设计令牌（1:1 复刻 tokens.css） ─────────────────────── */
:root{
  /* 纸面 */
  --paper:#f4eee4; --paper-hi:#fbf7ef; --paper-low:#e9dfd0;
  /* 墨色 */
  --ink:#201c17; --ink-2:#34302a; --ink-line:#4a433b;
  --ink-text:#a99f91; --ink-text-hi:#e8ddce; --ink-text-faint:#94897c;
  /* 中性 */
  --muted:#746b5e; --faint:#9c9182; --rule:#cdbfa9;
  /* 牛血红强调 */
  --red:#7a2e2a; --red-hi:#b65d53; --red-on-ink:#d27d74;
  /* 尺寸/动效 */
  --header-height:66px;
  --content-width:1180px;
  --page-gutter:clamp(22px,4vw,48px);
  --ease:cubic-bezier(0.22,0.8,0.22,1);
  /* 字型 */
  --serif:Georgia,'Noto Serif SC','Songti SC',serif;
  --sans:'Noto Sans SC','Microsoft YaHei',sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}

/* ─────────────────────── 基础重置（base.css） ─────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); color:var(--ink-2); background:var(--paper);
  line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:4px}
::selection{color:var(--paper-hi);background:var(--red)}

/* 滚动条 */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(122,46,42,0.22);border-radius:6px;border:3px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:rgba(122,46,42,0.5)}

/* 全局衬线化（正文与标题走 serif，元数据走 mono） */
.page-shell,h1,h2,h3,h4,.serif{font-family:var(--serif)}

/* 容器 */
.page-shell{
  max-width:var(--content-width); margin:0 auto;
  padding:0 var(--page-gutter);
}

/* ─────────────────────── 顶部导航（base.css / DossierHeader） ─────────────────────── */
.dossier-header{
  position:fixed; top:0; left:0; right:0; z-index:80;
  height:var(--header-height);
  background:color-mix(in srgb, var(--paper), transparent 8%);
  backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
  border-bottom:1px solid var(--rule);
}
.dossier-header__inner{
  max-width:var(--content-width); height:100%; margin:0 auto;
  padding:0 var(--page-gutter);
  display:flex; align-items:center; justify-content:space-between; gap:32px;
}
.dossier-mark{display:flex;align-items:baseline;gap:9px;flex-shrink:0}
.dossier-mark__name{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-0.01em}
.dossier-mark__meta{font-family:var(--mono);font-size:10.5px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase}

.primary-nav{display:flex;align-items:center;gap:29px}
.primary-nav a,.primary-nav button{
  font-size:14px; color:var(--ink-2); position:relative;
  padding:6px 0; transition:color .2s var(--ease);
}
.primary-nav a:hover,.primary-nav button:hover{color:var(--red)}
.primary-nav a.is-active{color:var(--red)}
.primary-nav a.is-active::after{
  content:""; position:absolute; left:0; right:0; bottom:-2px;
  height:2px; background:var(--red);
}
.primary-nav__agent{
  color:var(--red)!important; font-family:var(--mono); font-size:12px;
  letter-spacing:0.08em; text-transform:uppercase;
}

/* 移动端菜单 */
.menu-trigger{display:none;font-family:var(--mono);font-size:12px;letter-spacing:0.1em}
@media (max-width:959.98px){
  .primary-nav{
    position:fixed; top:var(--header-height); left:0; right:0;
    background:var(--paper-hi); border-bottom:1px solid var(--rule);
    flex-direction:column; align-items:flex-start; gap:0;
    padding:8px var(--page-gutter) 20px;
    transform:translateY(-130%); transition:transform .35s var(--ease);
    box-shadow:0 18px 30px rgba(32,28,23,0.08);
  }
  .primary-nav.is-open{transform:translateY(0)}
  .primary-nav a,.primary-nav button{width:100%;padding:13px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .menu-trigger{display:block}
}

/* ─────────────────────── PageLead 通用页头 ─────────────────────── */
.page-lead{
  padding:clamp(74px,8vw,112px) 0 58px;
  border-bottom:1px solid var(--rule);
  background:var(--paper-hi);
}
.page-lead__grid{
  display:grid; grid-template-columns:0.34fr 1fr 0.58fr;
  gap:clamp(24px,4vw,56px); align-items:end;
}
.page-lead__code{font-family:var(--mono);font-size:12px;letter-spacing:0.16em;color:var(--red);text-transform:uppercase}
.page-lead__title{
  font-family:var(--serif); font-weight:400;
  font-size:clamp(44px,6vw,78px); line-height:0.98;
  letter-spacing:-0.045em; color:var(--ink);
}
.page-lead__desc{
  font-family:var(--serif); font-size:15.5px; line-height:1.75;
  color:var(--muted); max-width:42ch;
}
@media (max-width:760px){
  .page-lead__grid{grid-template-columns:1fr;gap:18px;align-items:start}
}

/* ─────────────────────── StatusMark / type-tag / 状态标签 ─────────────────────── */
.status-mark{
  display:inline-flex; align-items:center; gap:7px;
  font-family:var(--mono); font-size:10px; letter-spacing:0.06em;
  color:var(--muted); text-transform:uppercase;
}
.status-mark::before{
  content:""; width:7px; height:7px; background:var(--red);
  transform:rotate(45deg); flex-shrink:0;
}
.status-mark[data-t="contrib"]::before{background:var(--muted)}

.type-tag{
  display:inline-flex; align-items:center;
  border:1px solid var(--rule); padding:3px 7px;
  font-family:var(--mono); font-size:10px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--ink-2);
}
.type-tag[data-t="FEATURE"]{border-color:var(--red);color:var(--red)}
.type-tag[data-t="INCIDENT"]{color:var(--ink-2)}
.type-tag[data-t="EVALUATION"]{border-style:dashed;border-color:var(--faint);color:var(--faint)}

/* 状态徽标（详情页 cover 用） */
.cover-status{display:flex;gap:14px;flex-wrap:wrap}

/* ─────────────────────── 筛选条 ─────────────────────── */
.case-filter{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:24px 0; border-bottom:1px solid var(--rule);
}
.case-filter__label{
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.14em;
  color:var(--muted); text-transform:uppercase; margin-right:8px;
}
.case-filter__chip{
  font-family:var(--mono); font-size:11px; letter-spacing:0.06em;
  text-transform:uppercase; padding:7px 13px;
  border:1px solid var(--rule); color:var(--ink-2);
  transition:all .2s var(--ease);
}
.case-filter__chip:hover{border-color:var(--ink-2);color:var(--ink)}
.case-filter__chip.is-active{background:var(--ink);border-color:var(--ink);color:var(--paper-hi)}
.case-filter__count{
  margin-left:auto; font-family:var(--mono); font-size:11px;
  letter-spacing:0.1em; color:var(--muted);
}

/* ─────────────────────── Case 目录行（复刻 dossier-row） ─────────────────────── */
.case-list{padding:8px 0 0}
.case-row{
  display:grid; grid-template-columns:150px minmax(0,1fr) 240px;
  gap:clamp(20px,3vw,40px); align-items:start;
  padding:30px 18px 30px 0; position:relative;
  border-bottom:1px solid var(--rule);
  transition:background .2s var(--ease);
}
.case-row:hover{background:var(--paper-hi)}
.case-row:last-child{border-bottom:none}
.case-row__code{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.case-row__code-text{font-family:var(--mono);font-size:12px;letter-spacing:0.1em;color:var(--red)}
.case-row__body{min-width:0}
.case-row__title{
  font-family:var(--serif); font-weight:400;
  font-size:clamp(24px,2.6vw,38px); line-height:1.12;
  letter-spacing:-0.02em; color:var(--ink); margin-bottom:10px;
}
.case-row__summary{
  font-family:var(--serif); font-size:14px; line-height:1.8;
  color:var(--muted); max-width:46ch; margin-bottom:14px;
}
.case-row__status{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.case-row__project{
  font-family:var(--mono); font-size:11px; color:var(--muted);
  letter-spacing:0.04em;
}
.case-row__project a{border-bottom:1px solid var(--rule);padding-bottom:1px}
.case-row__project a:hover{color:var(--red);border-color:var(--red)}
.case-row__project--none{color:var(--faint);font-style:italic;border:none}
.case-row__tech{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.case-row__counts{
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em;
  color:var(--faint); text-transform:uppercase;
}
.case-row__counts b{color:var(--ink-2);font-weight:400}
.case-row::after{
  content:"↗"; position:absolute; right:0; bottom:26px;
  font-family:var(--mono); font-size:15px; color:var(--red);
  opacity:0; transform:translateX(-6px); transition:all .25s var(--ease);
}
.case-row:hover::after{opacity:1;transform:translateX(0)}

@media (max-width:760px){
  .case-row{grid-template-columns:1fr;gap:14px;padding:26px 0}
  .case-row::after{display:none}
}

/* 空状态 */
.case-empty{
  padding:90px 0; text-align:center; color:var(--muted);
}
.case-empty__code{font-family:var(--mono);font-size:11px;letter-spacing:0.16em;color:var(--red);text-transform:uppercase;margin-bottom:18px}
.case-empty__title{font-family:var(--serif);font-size:28px;color:var(--ink);margin-bottom:12px}
.case-empty__desc{font-family:var(--serif);font-size:15px;line-height:1.7;max-width:40ch;margin:0 auto 26px}

/* ─────────────────────── DossierFooter ─────────────────────── */
.dossier-footer{
  border-top:1px solid var(--rule); margin-top:60px;
  padding:64px 0 36px; background:var(--paper-hi);
}
.dossier-footer__grid{
  display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:55px;
}
.dossier-footer h3{
  font-family:var(--mono); font-size:11px; letter-spacing:0.16em;
  color:var(--red); text-transform:uppercase; margin-bottom:18px;
}
.dossier-footer p{font-family:var(--serif);font-size:13.5px;line-height:1.8;color:var(--ink-2);max-width:38ch}
.dossier-footer__base{
  margin-top:48px; padding-top:22px; border-top:1px solid var(--rule);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em;
  color:var(--muted); text-transform:uppercase;
}
@media (max-width:760px){.dossier-footer__grid{grid-template-columns:1fr;gap:32px}}

/* ════════════════════════════════════════════════════════════════════
   Case 详情页（复刻 ProjectPage 的 cover + story 双栏）
   ════════════════════════════════════════════════════════════════════ */

/* 深色封面 */
.case-cover{
  background:var(--ink); color:var(--paper);
  padding:92px 0 76px; position:relative; overflow:hidden;
}
/* 暖色纸纹（复刻 hero 的极淡纹理，避免纯黑空洞） */
.case-cover::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 80% 20%, rgba(122,46,42,0.045), transparent 55%),
    repeating-linear-gradient(90deg, transparent 0 2px, rgba(111,93,70,0.055) 2px 4px);
  pointer-events:none;
}
.case-cover__inner{
  position:relative; display:grid; grid-template-columns:0.26fr 1fr 0.35fr;
  gap:clamp(24px,4vw,56px); align-items:start;
}
.case-cover__code{display:flex;flex-direction:column;gap:12px}
.case-cover__code-text{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;color:var(--red-hi)}
.case-record-type{
  font-family:var(--mono); font-size:11px; letter-spacing:0.14em;
  color:var(--red-on-ink); text-transform:uppercase; margin-bottom:22px;
}
.case-cover__title{
  font-family:var(--serif); font-weight:400;
  font-size:clamp(48px,6vw,88px); line-height:1.02;
  letter-spacing:-0.04em; color:var(--paper); margin-bottom:24px;
}
.case-cover__summary{
  font-family:var(--serif); font-size:20px; line-height:1.7;
  color:var(--ink-text-hi); max-width:30ch;
}
.case-cover__side{
  display:flex; flex-direction:column; gap:18px;
  padding-top:8px;
}
.case-cover__side-label{
  font-family:var(--mono); font-size:10px; letter-spacing:0.14em;
  color:var(--ink-text); text-transform:uppercase; margin-bottom:6px;
}
.case-cover__project-link{
  font-family:var(--serif); font-size:16px; color:var(--ink-text-hi);
  border-bottom:1px solid var(--ink-line); padding-bottom:3px;
  display:inline-block; transition:color .2s var(--ease);
}
.case-cover__project-link:hover{color:var(--paper)}
.case-cover__project--none{
  font-family:var(--serif); font-size:14px; color:var(--ink-text-faint); font-style:italic;
}

@media (max-width:1000px){.case-cover__inner{grid-template-columns:1fr;gap:24px}}

/* 详情主体（TOC + story） */
.case-body{padding:90px 0 130px}
.case-body__grid{
  display:grid; grid-template-columns:240px minmax(0,860px);
  gap:clamp(48px,8vw,130px);
}

/* 粘性目录 */
.case-toc{
  position:sticky; top:calc(var(--header-height) + 30px);
  align-self:start;
}
.case-toc__label{
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.16em;
  color:var(--red); text-transform:uppercase; margin-bottom:20px;
}
.case-toc__list{list-style:none;display:flex;flex-direction:column;gap:0}
.case-toc__list a{
  display:block; padding:11px 0; border-top:1px solid var(--rule);
  font-family:var(--serif); font-size:14.5px; color:var(--muted);
  transition:color .2s var(--ease); position:relative;
}
.case-toc__list li:last-child a{border-bottom:1px solid var(--rule)}
.case-toc__list a:hover,.case-toc__list a.is-active{color:var(--red)}
.case-toc__num{
  font-family:var(--mono); font-size:10px; letter-spacing:0.1em;
  color:var(--red); margin-right:10px; opacity:.7;
}
.case-toc__ask{
  display:block; margin-top:22px; padding:14px 16px;
  border:1px solid var(--red); color:var(--red);
  font-family:var(--mono); font-size:11px; letter-spacing:0.1em;
  text-transform:uppercase; text-align:left;
  transition:all .2s var(--ease);
}
.case-toc__ask:hover{background:var(--red);color:var(--paper-hi)}

@media (max-width:760px){
  .case-body__grid{grid-template-columns:1fr;gap:0}
  .case-toc{position:static;margin-bottom:34px}
}

/* 八段结构 */
.case-story{min-width:0}
.case-section{margin-bottom:0}
.case-section__code{
  font-family:var(--mono); font-size:11px; letter-spacing:0.16em;
  color:var(--red); text-transform:uppercase; margin-bottom:14px;
  display:block;
}
.case-section__title{
  font-family:var(--serif); font-weight:400;
  font-size:clamp(36px,4vw,54px); line-height:1.08;
  letter-spacing:-0.03em; color:var(--ink); margin-bottom:34px;
}
.case-prose{
  font-family:var(--serif); font-size:17px; line-height:2;
  color:var(--ink-2); max-width:64ch;
}
.case-prose--lead{
  font-size:19px; line-height:1.8; color:var(--ink);
}

/* 编号列表（decimal-leading-zero + 红色 mono 计数） */
.case-list-numbered{list-style:none;counter-reset:case;margin-top:6px}
.case-list-numbered > li{
  counter-increment:case;
  position:relative; padding:22px 0 22px 54px;
  border-top:1px solid var(--rule);
  font-family:var(--serif); font-size:17px; line-height:1.8; color:var(--ink-2);
  max-width:64ch;
}
.case-list-numbered > li:last-child{border-bottom:1px solid var(--rule)}
.case-list-numbered > li::before{
  content:counter(case,decimal-leading-zero);
  position:absolute; left:0; top:24px;
  font-family:var(--mono); font-size:10px; letter-spacing:0.1em; color:var(--red);
}

/* 验证段（深色反白面板，复刻 project-story__dark） */
.case-section--dark{
  background:var(--ink); color:var(--paper);
  padding:64px 50px; margin:48px -50px 0;
}
.case-section--dark .case-section__code{color:var(--red-on-ink)}
.case-section--dark .case-section__title{color:var(--paper)}
.case-section--dark .case-list-numbered > li{border-color:var(--ink-line);color:var(--ink-text-hi)}
.case-section--dark .case-list-numbered > li::before{color:var(--red-on-ink)}
@media (max-width:1249px){.case-section--dark{margin:48px 0 0}}

/* 结果段引述 */
.case-outcome{
  font-family:var(--serif); font-size:clamp(22px,2.4vw,30px); line-height:1.55;
  color:var(--ink); border-left:2px solid var(--red);
  padding:6px 0 6px 28px; margin-top:8px; max-width:60ch;
}

/* 限制段 */
.case-limits{display:flex;flex-direction:column;gap:0;margin-top:8px}
.case-limits li{
  font-family:var(--serif); font-size:16px; line-height:1.8; color:var(--ink-2);
  padding:20px 0 20px 30px; border-top:1px solid var(--rule);
  position:relative; max-width:64ch;
}
.case-limits li:last-child{border-bottom:1px solid var(--rule)}
.case-limits li::before{
  content:"—"; position:absolute; left:0; top:20px;
  font-family:var(--mono); color:var(--muted);
}

/* 证据列表 */
.case-evidence{display:flex;flex-direction:column;gap:0}
.case-evidence__item{
  display:grid; grid-template-columns:80px 1fr; gap:24px;
  padding:26px 0; border-top:1px solid var(--rule); align-items:start;
}
.case-evidence__item:last-child{border-bottom:1px solid var(--rule)}
.case-evidence__code{
  font-family:var(--mono); font-size:11px; letter-spacing:0.1em; color:var(--red);
}
.case-evidence__title{
  font-family:var(--serif); font-size:18px; color:var(--ink); margin-bottom:8px; line-height:1.4;
}
.case-evidence__summary{font-family:var(--serif);font-size:14.5px;line-height:1.75;color:var(--muted);max-width:60ch;margin-bottom:8px}
.case-evidence__meta{font-family:var(--mono);font-size:10.5px;letter-spacing:0.08em;color:var(--faint);text-transform:uppercase}

/* 建议问题 + 询问入口 */
.case-questions{display:flex;flex-direction:column;gap:0;margin-bottom:40px}
.case-questions button{
  display:flex; align-items:flex-start; gap:16px; width:100%;
  text-align:left; padding:22px 0; border-top:1px solid var(--rule);
  transition:color .2s var(--ease);
}
.case-questions button:last-child{border-bottom:1px solid var(--rule)}
.case-questions button:hover .case-questions__text{color:var(--red)}
.case-questions__q{
  font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em;
  color:var(--red); margin-top:5px; flex-shrink:0;
}
.case-questions__text{
  font-family:var(--serif); font-size:17px; line-height:1.6; color:var(--ink-2);
  transition:color .2s var(--ease);
}
.case-questions button:hover .case-questions__text::after{
  content:" ↗"; color:var(--red);
}
.case-ask-banner{
  margin-top:20px; padding:34px 38px; background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
}
.case-ask-banner__title{font-family:var(--serif);font-size:24px;color:var(--paper);letter-spacing:-0.01em}
.case-ask-banner__sub{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--ink-text);text-transform:uppercase;margin-top:6px}
.case-ask-banner__btn{
  background:var(--red); color:var(--paper-hi); padding:15px 26px;
  font-family:var(--mono); font-size:12px; letter-spacing:0.12em;
  text-transform:uppercase; transition:background .2s var(--ease);
}
.case-ask-banner__btn:hover{background:var(--red-hi)}

/* 详情页底栏（下一步） */
.case-next{
  margin-top:80px; padding-top:40px; border-top:1px solid var(--rule);
  display:grid; grid-template-columns:1fr 1fr; gap:48px;
}
.case-next a{
  display:block; padding:8px 0;
  font-family:var(--mono); font-size:11px; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--red);
  border-bottom:1px solid var(--red);
}
.case-next__label{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.case-next__title{font-family:var(--serif);font-size:20px;color:var(--ink);margin-top:6px}
@media (max-width:760px){.case-next{grid-template-columns:1fr;gap:24px}}

/* 404 */
.case-404{padding:140px 0 100px;text-align:center}
.case-404__code{font-family:var(--mono);font-size:13px;letter-spacing:0.2em;color:var(--red);margin-bottom:24px}
.case-404__title{font-family:var(--serif);font-size:clamp(40px,5vw,64px);color:var(--ink);letter-spacing:-0.03em;margin-bottom:18px}
.case-404__desc{font-family:var(--serif);font-size:16px;color:var(--muted);max-width:42ch;margin:0 auto 32px;line-height:1.8}

/* ════════════════════════════════════════════════════════════════════
   Agent 工作台（Case → Agent 交接演示，简化版）
   ════════════════════════════════════════════════════════════════════ */
.agent-stage{
  background:var(--paper); padding:60px 0 120px; min-height:80vh;
}
.agent-context-bar{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:16px 22px; margin-bottom:28px;
  background:var(--paper-hi); border:1px solid var(--rule); border-left:3px solid var(--red);
}
.agent-context-bar__label{
  font-family:var(--mono); font-size:10px; letter-spacing:0.14em;
  color:var(--muted); text-transform:uppercase;
}
.agent-context-bar__slug{
  font-family:var(--mono); font-size:12px; color:var(--red); letter-spacing:0.04em;
}
.agent-context-bar__clear{
  margin-left:auto; font-family:var(--mono); font-size:11px;
  letter-spacing:0.08em; color:var(--muted); text-transform:uppercase;
  padding:6px 12px; border:1px solid var(--rule);
  transition:all .2s var(--ease);
}
.agent-context-bar__clear:hover{color:var(--red);border-color:var(--red)}
.agent-context-bar.is-cleared{border-left-color:var(--rule);opacity:.7}
.agent-context-bar.is-cleared .agent-context-bar__slug{color:var(--faint)}

.agent-mock{
  max-width:780px; margin:0 auto;
  display:flex; flex-direction:column; gap:22px;
}
.agent-bubble{
  padding:24px 28px; border:1px solid var(--rule); background:var(--paper-hi);
}
.agent-bubble--user{
  background:transparent; border:none; padding:6px 0;
  text-align:right; align-self:flex-end; max-width:80%;
}
.agent-bubble--user .agent-bubble__text{font-family:var(--serif);font-size:16px;color:var(--ink-2)}
.agent-bubble__role{
  font-family:var(--mono); font-size:10px; letter-spacing:0.14em;
  color:var(--red); text-transform:uppercase; margin-bottom:12px;
}
.agent-bubble--user .agent-bubble__role{color:var(--muted);margin-bottom:8px}
.agent-bubble__text{font-family:var(--serif);font-size:15.5px;line-height:1.9;color:var(--ink-2)}
.agent-bubble__text p+p{margin-top:12px}

/* 交接契约预览（演示用，说明 source=CASE） */
.contract-note{
  max-width:780px; margin:36px auto 0; padding:24px 28px;
  background:var(--ink); color:var(--ink-text-hi);
  font-family:var(--mono); font-size:11.5px; line-height:1.9;
  overflow-x:auto;
}
.contract-note__label{
  font-family:var(--mono); font-size:10px; letter-spacing:0.16em;
  color:var(--red-on-ink); text-transform:uppercase; margin-bottom:14px; display:block;
}
.contract-note pre{margin:0;white-space:pre;color:var(--ink-text-hi)}

/* ─────────────────────── reveal 动效（motion.css） ─────────────────────── */
.reveal{animation:dossier-reveal .75s var(--ease) both}
@keyframes dossier-reveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* Reduced Motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important; animation-iteration-count:1!important;
    transition-duration:.001ms!important; scroll-behavior:auto!important;
  }
  .reveal{animation:none}
}
</style>
</head>

const TYPE_LABEL = { FEATURE:'功能任务', INCIDENT:'问题处理', EVALUATION:'工具评测' };
const STATUS_LABEL = {
  DELIVERED:'已交付', IMPLEMENTED_TESTED:'已实现并测试', PROTOTYPE:'原型验证',
  DESIGNED:'已设计', LEARNING:'学习中', PLANNED:'已规划', UNKNOWN:'状态未知'
};
const CONTRIB_LABEL = { PRIMARY:'主要负责', COLLABORATIVE:'协作参与', INDEPENDENT:'独立完成', OBSERVED_LEARNING:'观察学习' };

const detailBySlug = Object.fromEntries(DATA.details.map(d=>[d.slug,d]));
const dirBySlug = Object.fromEntries(DATA.dir.map(d=>[d.slug,d]));

/* ════════════════════════════════════════════════════════════════════
   路由（hash router：#/cases, #/cases/:slug, #/agent?case=…）
   §5.1：旧 /projects/{caseSlug} 重定向到 /cases/{caseSlug}
   ════════════════════════════════════════════════════════════════════ */
function parseRoute(){
  let h = location.hash.replace(/^#/,'');
  // 旧 URL 兼容：/projects/<caseSlug> → /cases/<caseSlug>
  h = h.replace(/^\/projects\/([a-z0-9-]+)$/i, '/cases/$1');
  if(h.startsWith('/cases/')){
    const slug = h.slice('/cases/'.length).split('?')[0];
    return { name:'case-detail', slug };
  }
  if(h.startsWith('/cases')) return { name:'case-list' };
  if(h.startsWith('/agent')) return { name:'agent', caseSlug: getQueryParam('case') };
  return { name:'home' };
}
function getQueryParam(key){
  const q = location.hash.split('?')[1] || '';
  return new URLSearchParams(q).get(key);
}
function navigate(hash){
  location.hash = hash;
}

/* ════════════════════════════════════════════════════════════════════
   渲染：Case 目录
   ════════════════════════════════════════════════════════════════════ */
let activeFilter = 'ALL';
const FILTERS = [
  {key:'ALL', label:'全部', type:null},
  {key:'FEATURE', label:'功能任务', type:'FEATURE'},
  {key:'INCIDENT', label:'问题处理', type:'INCIDENT'},
  {key:'EVALUATION', label:'工具评测', type:'EVALUATION'},
];

function renderCaseList(){
  const rows = DATA.dir.filter(c => activeFilter==='ALL' ? true : c.type===activeFilter);

  const filterChips = FILTERS.map(f=>{
    const cnt = f.type ? DATA.dir.filter(c=>c.type===f.type).length : DATA.dir.length;
    const cls = f.key===activeFilter ? 'is-active' : '';
    return `<button class="case-filter__chip ${cls}" data-filter="${f.key}">${f.label} · ${String(cnt).padStart(2,'0')}</button>`;
  }).join('');

  let body;
  if(rows.length===0){
    // §5.6 空状态
    body = `<div class="case-empty reveal">
      <div class="case-empty__code">EMPTY · 无匹配案卷</div>
      <h2 class="case-empty__title">该筛选下暂无公开案例</h2>
      <p class="case-empty__desc">当前公开 Bundle 在此类型下没有已批准的 Case。这不是加载失败——只是该分类的公开内容尚未发布。</p>
      <button class="case-filter__chip is-active" onclick="setFilter('ALL')">查看全部案例</button>
    </div>`;
  } else {
    body = `<div class="case-list">${rows.map(renderCaseRow).join('')}</div>`;
  }

  return `
    <section class="page-lead reveal">
      <div class="page-shell page-lead__grid">
        <div class="page-lead__code">02 / CASE INDEX</div>
        <h1 class="page-lead__title">案例目录</h1>
        <p class="page-lead__desc">49 个具体任务、问题与评测——记录它们如何被识别、判断、处理与验证。与「项目」并列的独立公开入口，强调具体问题而非长期主线。</p>
      </div>
    </section>
    <div class="page-shell">
      <div class="case-filter reveal">
        <span class="case-filter__label">类型筛选</span>
        ${filterChips}
        <span class="case-filter__count">显示 ${String(rows.length).padStart(2,'0')} / ${DATA.counts.total} 个案例</span>
      </div>
      ${body}
    </div>
    ${renderFooter()}
  `;
}

function renderCaseRow(c){
  return `<a class="case-row" href="#/cases/${c.slug}" data-slug="${c.slug}">
    <div class="case-row__code">
      <span class="case-row__code-text">${c.code}</span>
      <span class="type-tag" data-t="${c.type}">${TYPE_LABEL[c.type]}</span>
    </div>
    <div class="case-row__body">
      <h3 class="case-row__title">${c.title}</h3>
      <p class="case-row__summary">${c.summary}</p>
      <div class="case-row__status">
        <span class="status-mark">${STATUS_LABEL[c.status]}</span>
        <span class="status-mark" data-t="contrib">${CONTRIB_LABEL[c.contrib]}</span>
        ${c.project
          ? `<span class="case-row__project">关联项目 · <a href="#/projects/${c.project.slug}" onclick="event.stopPropagation()">${c.project.title}</a></span>`
          : `<span class="case-row__project case-row__project--none">独立案例</span>`}
      </div>
    </div>
    <div class="case-row__tech">
      <span class="case-row__counts"><b>${c.nC}</b> CLAIM · <b>${c.nE}</b> EVIDENCE</span>
      <span class="case-row__counts">${c.code}</span>
    </div>
  </a>`;
}

function renderCaseDetail(slug){
  const c = detailBySlug[slug];
  // §5.6 404：没有详情数据的 Case（本原型只内联了 3 个详情，其余用目录摘要 + 引导）
  if(!c){
    const stub = dirBySlug[slug];
    if(stub){
      return renderCaseStub(stub);
    }
    return renderNotFound(slug);
  }

  const sections = [
    { id:'problem',   code:'01 / 背景',   title:'问题与背景' },
    { id:'actions',   code:'02 / 动作',   title:'采取的动作' },
    { id:'decisions', code:'03 / 判断',   title:'关键判断' },
    { id:'verify',    code:'04 / 验证',   title:'验证过程', dark:true },
    { id:'outcome',   code:'05 / 结果',   title:'结果' },
    { id:'limits',    code:'06 / 边界',   title:'限制与边界' },
    { id:'evidence',  code:'07 / 证据',   title:'公开证据' },
    { id:'questions', code:'08 / 延伸',   title:'建议问题' },
  ];

  const tocItems = sections.map(s=>
    `<li><a href="#sec-${s.id}" data-toc="${s.id}"><span class="case-toc__num">${s.code.split('/')[0]}</span>${s.title}</a></li>`
  ).join('');

  // 验证段（深色反白）
  const verifySection = `<section class="case-section case-section--dark" id="sec-verify">
    <span class="case-section__code">${sections[3].code}</span>
    <h2 class="case-section__title">${sections[3].title}</h2>
    <ol class="case-list-numbered">
      ${c.verification.map(v=>`<li>${v}</li>`).join('')}
    </ol>

window.setFilter = function(key){

/* ════════════════════════════════════════════════════════════════════
   主渲染 + 路由
   ════════════════════════════════════════════════════════════════════ */
function render(){
  const route = parseRoute();
  const view = document.getElementById('view');
  let html, navActive;

  switch(route.name){
    case 'case-list':
      html = renderCaseList();
      navActive = 'cases';
      break;
    case 'case-detail':
      html = renderCaseDetail(route.slug);
      navActive = 'cases';
      break;
    case 'agent':
      if(route.caseSlug) agentState.caseSlug = route.caseSlug;
      html = renderAgent();
      navActive = 'agent';
      break;
    default:
      html = renderHome();
      navActive = '';
  }

  view.innerHTML = html;

  // 高亮导航
  document.querySelectorAll('.primary-nav a, .primary-nav button').forEach(el=>{
    el.classList.toggle('is-active', el.dataset.nav===navActive);
  });

  // 关闭移动菜单
  document.getElementById('primaryNav').classList.remove('is-open');
  document.getElementById('menuTrigger').setAttribute('aria-expanded','false');

  // 回到顶部（详情页 hash 锚点除外）
  if(!location.hash.includes('#sec-')){
    window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
  }

  // TOC 滚动高亮 + 平滑锚点
  initTocSpy();
}

/* TOC 滚动监听 */
function initTocSpy(){
  const links = document.querySelectorAll('.case-toc__list a');
  if(!links.length) return;
  const sections = [...links].map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);
  if(!sections.length) return;

  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id = e.target.id.replace('sec-','');
        links.forEach(a=>a.classList.toggle('is-active', a.dataset.toc===id));
      }
    });
  }, { rootMargin:'-30% 0px -60% 0px' });
  sections.forEach(s=>obs.observe(s));
}

/* 移动端菜单 */
document.getElementById('menuTrigger').addEventListener('click', ()=>{
  const nav = document.getElementById('primaryNav');
  const btn = document.getElementById('menuTrigger');
  const open = nav.classList.toggle('is-open');
  btn.setAttribute('aria-expanded', open);
  btn.textContent = open ? '关闭' : '目录';
});

/* 路由监听 */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{
  if(!location.hash) location.hash = '#/cases';
  else render();
});
// DOMContentLoaded 已触发时的兜底
if(document.readyState !== 'loading'){
  if(!location.hash) location.hash = '#/cases';
  else render();
}
