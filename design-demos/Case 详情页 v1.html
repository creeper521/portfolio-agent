<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<title>案例详情 · 工程成长档案</title>
<!--
  ════════════════════════════════════════════════════════════════════════
  Case 详情页 · 定稿原型（八段结构 + 封面元信息）

  设计决策（已确认）：
    · 封面右侧列 = case 元信息（类型/证据计数/断言计数/关联项目），替代 Project 页的 tech 列
    · 状态语言复用列表页：delivered=实心点 / prototype=虚线 / learning=空心点
    · 八段结构（spec §5.4）：背景→动作→判断→验证(深色)→结果→限制→证据→建议问题
    · 前 5 段沿用 ProjectPage 节奏（含「验证」深色反白面板），后 3 段为 Case 专属
    · 修复了现有 ProjectPage 的 6 个 Case 适配缺陷（无重复 decisions、limitations 独立成段等）

  数据契约对齐后端 GET /api/v1/cases/{slug} (CaseDetailResponse, 17 字段)：
    problem / actions[] / decisions[] / verification[] / outcome / limitations[]
    evidence[] (嵌套 EvidenceResponse) / suggestedQuestions[] / projectSlug(可空)
    + source=CASE 的 Agent 交接（spec §5.5）

  覆盖的边界状态：
    · 有证据+有建议问题（多语言）/ 独立案例 vs 关联项目（重复配置）
    · 无足够证据时的边界说明（代码图谱 prototype）
    · 404 / loading 占位

  视觉令牌 1:1 复刻 frontend tokens.css + ProjectPage.vue scoped CSS。
  ════════════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --paper:#f4eee4; --paper-hi:#fbf7ef; --paper-low:#e9dfd0;
  --ink:#201c17; --ink-2:#34302a; --ink-line:#4a433b;
  --ink-text:#a99f91; --ink-text-hi:#e8ddce; --ink-text-faint:#94897c;
  --muted:#746b5e; --faint:#9c9182; --rule:#cdbfa9;
  --red:#7a2e2a; --red-hi:#b65d53; --red-on-ink:#d27d74;
  --header-height:66px; --content-width:1180px;
  --page-gutter:clamp(22px,4vw,48px);
  --ease:cubic-bezier(0.22,0.8,0.22,1);
  --serif:Georgia,'Noto Serif SC','Songti SC',serif;
  --sans:'Noto Sans SC','Microsoft YaHei',sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink-2);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:4px}
::selection{color:var(--paper-hi);background:var(--red)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(122,46,42,0.22);border-radius:6px;border:3px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:rgba(122,46,42,0.5)}
h1,h2,h3,h4,.serif{font-family:var(--serif)}
.page-shell{max-width:var(--content-width);margin:0 auto;padding:0 var(--page-gutter);width:min(var(--content-width),calc(100% - var(--page-gutter)*2))}

/* ─────────────── 顶部导航 ─────────────── */
.dossier-header{position:fixed;top:0;left:0;right:0;z-index:80;height:var(--header-height);background:color-mix(in srgb,var(--paper),transparent 8%);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid var(--rule)}
.dossier-header__inner{max-width:var(--content-width);height:100%;margin:0 auto;padding:0 var(--page-gutter);display:flex;align-items:center;justify-content:space-between;gap:32px}
.dossier-mark{display:flex;align-items:baseline;gap:9px;flex-shrink:0}
.dossier-mark__name{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-0.01em}
.dossier-mark__meta{font-family:var(--mono);font-size:10.5px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase}
.primary-nav{display:flex;align-items:center;gap:29px}
.primary-nav a{font-size:14px;color:var(--ink-2);position:relative;padding:6px 0;transition:color .2s var(--ease)}
.primary-nav a:hover{color:var(--red)}
.primary-nav a.is-active{color:var(--red)}
.primary-nav a.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--red)}
.primary-nav__agent{color:var(--red)!important;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase}
.menu-trigger{display:none;font-family:var(--mono);font-size:12px;letter-spacing:0.1em}
@media (max-width:959.98px){
  .primary-nav{position:fixed;top:var(--header-height);left:0;right:0;background:var(--paper-hi);border-bottom:1px solid var(--rule);flex-direction:column;align-items:flex-start;gap:0;padding:8px var(--page-gutter) 20px;transform:translateY(-130%);transition:transform .35s var(--ease);box-shadow:0 18px 30px rgba(32,28,23,0.08)}
  .primary-nav.is-open{transform:translateY(0)}
  .primary-nav a{width:100%;padding:13px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .menu-trigger{display:block}
}

/* ════════════════════════════════════════════════════════════════════
   面包屑（spec §5.4：Case 须有面包屑，与 Project 区分）
   ════════════════════════════════════════════════════════════════════ */
.breadcrumb{padding-top:calc(var(--header-height) + 26px);padding-bottom:0}
.breadcrumb__list{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;color:var(--muted);text-transform:uppercase}
.breadcrumb__list a{transition:color .2s var(--ease)}
.breadcrumb__list a:hover{color:var(--red)}
.breadcrumb__sep{color:var(--faint)}
.breadcrumb__current{color:var(--ink-2)}

/* ════════════════════════════════════════════════════════════════════
   封面（深色）—— 复刻 project-cover，第3列改 case 元信息
   ════════════════════════════════════════════════════════════════════ */
.case-cover{color:var(--paper);background:var(--ink);padding:48px 0 76px;position:relative;overflow:hidden}
.case-cover::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(122,46,42,0.045),transparent 55%),repeating-linear-gradient(90deg,transparent 0 2px,rgba(111,93,70,0.055) 2px 4px);pointer-events:none}
.case-cover__grid{position:relative;display:grid;grid-template-columns:0.26fr 1fr 0.35fr;gap:clamp(28px,5vw,72px)}
.case-cover__grid>*{min-width:0}
.case-cover__code{display:flex;flex-direction:column;align-content:flex-start;gap:14px}
.case-cover__code>span:first-child{color:var(--red-hi);font-family:var(--mono);font-size:10px;letter-spacing:0.14em)}
/* cover 内状态点：和列表页 tab/行一致的语言 */
.cover-status{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;color:var(--ink-text);text-transform:uppercase}
.cover-status__dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--red-on-ink);background:var(--ink);flex-shrink:0}
.cover-status[data-sg="delivered"] .cover-status__dot{background:var(--red-on-ink)}
.cover-status[data-sg="prototype"] .cover-status__dot{background:var(--ink);border-style:dashed}
.cover-status[data-sg="learning"] .cover-status__dot{background:var(--ink);border-color:var(--ink-text)}
.cover-status--contrib .cover-status__dot{display:none}
.case-cover__record-type{color:var(--red-on-ink);font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:24px}
.case-cover__title{font-family:var(--serif);font-weight:400;font-size:clamp(48px,6vw,88px);line-height:1.02;letter-spacing:-0.04em;color:var(--paper);margin-bottom:28px}
.case-cover__summary{max-width:760px;color:var(--ink-text-hi);font-family:var(--serif);font-size:20px;line-height:1.7}
/* 第3列：case 元信息 */
.case-cover__meta{display:flex;flex-direction:column;gap:0}
.case-cover__meta-label{color:var(--ink-text);font-family:var(--mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--ink-line)}
.case-cover__meta-item{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--ink-line)}
.case-cover__meta-item:last-child{border-bottom:none}
.case-cover__meta-key{font-family:var(--mono);font-size:9.5px;letter-spacing:0.12em;color:var(--ink-text-faint);text-transform:uppercase}
.case-cover__meta-val{font-family:var(--serif);font-size:15px;color:var(--ink-text-hi);line-height:1.4}
.case-cover__meta-val--mono{font-family:var(--mono);font-size:12px;letter-spacing:0.04em}
.case-cover__meta-val a{border-bottom:1px solid var(--ink-line);padding-bottom:1px;transition:color .2s var(--ease)}
.case-cover__meta-val a:hover{color:var(--paper)}
.case-cover__meta-val--muted{color:var(--ink-text-faint);font-style:italic}
@media (max-width:1000px){.case-cover__grid{grid-template-columns:1fr;gap:32px}}

/* ════════════════════════════════════════════════════════════════════
   正文区（TOC + 八段 story）
   ════════════════════════════════════════════════════════════════════ */
.case-body{padding:90px 0 130px}
.case-body__grid{display:grid;grid-template-columns:240px minmax(0,860px);gap:clamp(48px,8vw,130px)}

/* TOC（sticky，scrollspy 高亮） */
.case-toc{position:sticky;top:calc(var(--header-height) + 30px);align-self:start;display:grid;height:fit-content;gap:0}
.case-toc__label{margin-bottom:18px;color:var(--red);font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase}
.case-toc a{padding:12px 0;color:var(--muted);border-bottom:1px solid var(--rule);font-size:13px;transition:color .2s var(--ease);display:flex;gap:10px;align-items:baseline}
.case-toc a:first-of-type{border-top:1px solid var(--rule)}
.case-toc a:hover,.case-toc a.is-active{color:var(--red)}
.case-toc__num{font-family:var(--mono);font-size:10px;letter-spacing:0.06em;color:var(--red);opacity:.7;min-width:22px}
.case-toc a.is-active .case-toc__num{opacity:1}
.case-toc__ask{margin-top:22px;padding:14px 16px;border:1px solid var(--red);color:var(--red);font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;text-align:left;transition:all .2s var(--ease);display:block;width:100%}
.case-toc__ask:hover{background:var(--red);color:var(--paper-hi)}
@media (max-width:900px){.case-body__grid{grid-template-columns:1fr;gap:0}.case-toc{position:static;margin-bottom:40px;display:grid;grid-template-columns:repeat(4,1fr);gap:0}.case-toc__label{grid-column:1/-1;margin-bottom:14px}.case-toc__ask{grid-column:1/-1;margin-top:18px}}
@media (max-width:620px){.case-toc{display:none}}

/* 八段 */
.case-story{min-width:0}
.case-story section{padding:0 0 84px;scroll-margin-top:100px}
.case-story section+section:not(.case-story__dark){padding-top:76px;border-top:1px solid var(--rule)}
.section-code{display:block;margin:0 0 16px;color:var(--red);font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase}
.case-story h2{margin:0 0 28px;font-family:var(--serif);font-size:clamp(36px,4vw,54px);font-weight:400;letter-spacing:-0.03em;line-height:1.08}
.story-lead,.case-story li,.case-story section>p:not(.section-code){color:var(--ink-2);font-family:var(--serif);font-size:17px;line-height:2}
.story-lead{font-size:19px;line-height:1.8;color:var(--ink)}
/* 编号列表 */
.case-story ol{margin:0;padding:0;list-style:none;counter-reset:cs}
.case-story ol>li{position:relative;padding:18px 0 18px 54px;border-top:1px solid var(--rule);counter-increment:cs;font-family:var(--serif);font-size:17px;line-height:1.8;color:var(--ink-2)}
.case-story ol>li:last-child{border-bottom:1px solid var(--rule)}
.case-story ol>li::before{position:absolute;left:0;top:20px;content:counter(cs,decimal-leading-zero);color:var(--red);font-family:var(--mono);font-size:10px;letter-spacing:0.06em}

/* 深色反白：验证段 */
.case-story__dark{margin:0 0 84px!important;padding:64px 50px!important;color:var(--paper);background:var(--ink)}
.case-story__dark .section-code{color:var(--red-on-ink)}
.case-story__dark h2{color:var(--paper)}
.case-story__dark .story-lead,.case-story__dark ol>li{color:var(--ink-text-hi)}
.case-story__dark ol>li{border-color:var(--ink-line)}
.case-story__dark ol>li::before{color:var(--red-on-ink)}
@media (min-width:1250px){.case-story__dark{width:calc(100% + 100px);margin-left:-50px!important}}
@media (max-width:900px){.case-story__dark{margin-inline:calc(var(--page-gutter)*-0.5)!important;width:auto}}

/* 结果段：引述 */
.case-outcome{font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);line-height:1.55;color:var(--ink);border-left:2px solid var(--red);padding:6px 0 6px 28px;max-width:60ch;margin-top:8px}

/* 限制段 */
.case-limits{display:flex;flex-direction:column;margin:8px 0 0;padding:0;list-style:none}
.case-limits li{font-family:var(--serif);font-size:16px;line-height:1.8;color:var(--ink-2);padding:20px 0 20px 30px;border-top:1px solid var(--rule);position:relative;max-width:64ch}
.case-limits li:last-child{border-bottom:1px solid var(--rule)}
.case-limits li::before{content:"—";position:absolute;left:0;top:20px;font-family:var(--mono);color:var(--muted)}

/* 证据段 */
.case-evidence{display:flex;flex-direction:column;gap:0}
.case-evidence__item{display:grid;grid-template-columns:84px 1fr;gap:24px;padding:26px 0;border-top:1px solid var(--rule);align-items:start}
.case-evidence__item:last-child{border-bottom:1px solid var(--rule)}
.case-evidence__code{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--red)}
.case-evidence__title{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:8px;line-height:1.4}
.case-evidence__summary{font-family:var(--serif);font-size:14.5px;line-height:1.75;color:var(--muted);max-width:60ch;margin-bottom:8px}
.case-evidence__meta{font-family:var(--mono);font-size:10.5px;letter-spacing:0.08em;color:var(--faint);text-transform:uppercase}
.case-evidence__empty{color:var(--faint);font-style:italic;font-family:var(--serif);font-size:16px}

/* 建议问题段 */
.case-questions{display:flex;flex-direction:column;margin-bottom:36px}
.case-questions button{display:flex;align-items:flex-start;gap:16px;width:100%;text-align:left;padding:22px 0;border-top:1px solid var(--rule);transition:color .2s var(--ease)}
.case-questions button:last-child{border-bottom:1px solid var(--rule)}
.case-questions__q{font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;color:var(--red);margin-top:5px;flex-shrink:0}
.case-questions__text{font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink-2);transition:color .2s var(--ease)}
.case-questions button:hover .case-questions__text{color:var(--red)}
.case-questions button:hover .case-questions__text::after{content:" ↗";color:var(--red)}
.case-questions__empty{color:var(--faint);font-style:italic;font-family:var(--serif);font-size:16px}
/* 询问 banner（spec §5.5：Case→Agent 交接） */
.case-ask-banner{margin-top:20px;padding:34px 38px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.case-ask-banner__title{font-family:var(--serif);font-size:24px;color:var(--paper);letter-spacing:-0.01em}
.case-ask-banner__sub{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--ink-text);text-transform:uppercase;margin-top:6px}
.case-ask-banner__btn{background:var(--red);color:var(--paper-hi);padding:15px 26px;font-family:var(--mono);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;transition:background .2s var(--ease)}
.case-ask-banner__btn:hover{background:var(--red-hi)}

/* section-trace（段落追溯批注，复刻 ProjectPage） */
.section-trace{display:flex;justify-content:flex-end;flex-wrap:wrap;align-items:baseline;gap:12px;margin:20px 0 0;font:italic 15px/1.6 var(--serif);color:var(--muted)}
.section-trace em{font-style:normal;font-weight:500;color:var(--red);font-variant-numeric:tabular-nums}

/* 底部 next */
.case-next{margin-top:80px;padding-top:0;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule)}
.case-next a{display:block;padding:26px;font-family:var(--serif);font-size:15px;color:var(--ink-2);transition:color .2s var(--ease)}
.case-next a:first-child{border-right:1px solid var(--rule)}
.case-next a:hover{color:var(--red)}
.case-next__label{font-family:var(--mono);font-size:9.5px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:block}
.case-next__title{font-family:var(--serif);font-size:20px;color:var(--ink)}
@media (max-width:620px){.case-next{grid-template-columns:1fr}.case-next a:first-child{border-right:none;border-bottom:1px solid var(--rule)}}

/* 状态标签复用 */
.status-mark{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;color:var(--muted);text-transform:uppercase}
.status-mark::before{content:"";width:7px;height:7px;background:var(--red);transform:rotate(45deg);flex-shrink:0}
.type-tag{display:inline-flex;align-items:center;border:1px solid var(--rule);padding:3px 7px;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2)}
.type-tag[data-t="FEATURE"]{border-color:var(--red);color:var(--red)}
.type-tag[data-t="EVALUATION"]{border-style:dashed;border-color:var(--faint);color:var(--faint)}

/* 404 / loading */
.case-404{padding:140px 0 100px;text-align:center}
.case-404__code{font-family:var(--mono);font-size:13px;letter-spacing:0.2em;color:var(--red);margin-bottom:24px}
.case-404__title{font-family:var(--serif);font-size:clamp(40px,5vw,64px);color:var(--ink);letter-spacing:-0.03em;margin-bottom:18px}
.case-404__desc{font-family:var(--serif);font-size:16px;color:var(--muted);max-width:42ch;margin:0 auto 32px;line-height:1.8}
.case-loading{min-height:calc(100vh - var(--header-height));display:grid;place-content:center;text-align:center}
.case-loading__code{font-family:var(--mono);font-size:11px;letter-spacing:0.16em;color:var(--muted);text-transform:uppercase}

/* 页脚 */
.dossier-footer{border-top:1px solid var(--rule);margin-top:0;padding:64px 0 36px;background:var(--paper-hi)}
.dossier-footer__grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:55px;max-width:var(--content-width);margin:0 auto;padding:0 var(--page-gutter)}
.dossier-footer h3{font-family:var(--mono);font-size:11px;letter-spacing:0.16em;color:var(--red);text-transform:uppercase;margin-bottom:18px}
.dossier-footer p{font-family:var(--serif);font-size:13.5px;line-height:1.8;color:var(--ink-2);max-width:38ch}
.dossier-footer__base{margin-top:48px;padding-top:22px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;max-width:var(--content-width);margin-inline:auto;padding-inline:var(--page-gutter)}
@media (max-width:760px){.dossier-footer__grid{grid-template-columns:1fr;gap:32px}}

.reveal{animation:dossier-reveal .5s var(--ease) both}
@keyframes dossier-reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.reveal{animation:none}}
</style>
</head>
<body>

<!-- 顶部导航 -->
<header class="dossier-header">
  <div class="dossier-header__inner">
    <a class="dossier-mark" href="#/cases">
      <span class="dossier-mark__name">工程成长档案</span>
      <span class="dossier-mark__meta">/ ENGINEERING DOSSIER</span>
    </a>
    <nav class="primary-nav" id="primaryNav">
      <a href="#/cases" class="is-active">案例</a>
      <a href="#/projects">项目</a>
      <a href="#/timeline">时间线</a>
      <a href="#/evidence">证据</a>
      <a href="#/agent" class="primary-nav__agent">完整 Agent ↗</a>
    </nav>
    <button class="menu-trigger" id="menuTrigger" aria-expanded="false">目录</button>
  </div>
</header>

<main id="view"></main>

<script>
/* ════════════════════════════════════════════════════════════════════
   真实数据：3 个代表性 case 的完整详情（来自 Bundle）
   · 多语言图片   — FEATURE / DELIVERED / 独立案例 / 有证据有建议问题
   · 代码图谱     — EVALUATION / PROTOTYPE / 独立案例 / 原型边界说明
   · 重复配置     — INCIDENT / DELIVERED / 关联项目 / 脱敏摘要
   ════════════════════════════════════════════════════════════════════ */
const CASES = {"multilingual-image-preservation":{"code":"CASE-01","slug":"multilingual-image-preservation","type":"FEATURE","title":"多语言图片上传结果保留修复","summary":"修复后续语言上传覆盖既有语言映射的问题。","problem":"分次上传不同语言图片时，后一次结果会替换此前已经可见的语言集合。","actions":["读取已经持久化的语言映射。","只合并本次请求中实际上传且有效的语言。","保留未被本次上传替换的既有语言结果。"],"decisions":["使用既有持久化映射与本次有效上传的并集作为最终结果。","无效或缺少图片的语言不写入新映射。"],"verification":["第一次上传德语图片。","第一次查询确认德语图片可用。","第二次上传法语图片。","第二次查询确认德语与法语图片同时可用。"],"outcome":"按「德语上传、德语查询、法语上传、德语与法语查询」的顺序完成回归，后续上传不再删除此前语言结果。","limitations":["不公开内部模块、数据结构、渠道、区域和存储标识。","公开材料只描述行为与验证，不展示原始代码、截图或内部地址。"],"status":"DELIVERED","contrib":"PRIMARY","project":null,"evidenceCount":1,"claimCount":4,"evidence":[{"code":"E-03","title":"多语言图片保留实现与回归证据集","summary":"由实现记录和顺序上传回归记录脱敏汇总，支持既有语言映射保留与德语、法语分次上传后的共存查询。","period":"2026-04-29 → 2026-06-16","sources":2}],"questions":["多语言图片分次上传为什么会覆盖既有结果，最终如何修复并验证？","多语言图片保留修复采用了什么顺序验证德语和法语结果能够共存？","多语言图片修复会不会为没有上传记录的语言补造历史结果？"]},"codegraph-evaluation":{"code":"CASE-03","slug":"codegraph-evaluation","type":"EVALUATION","title":"代码图谱工具端到端评测","summary":"通过符号检索样本和两组工具任务评估代码图谱的收益与失效边界。","problem":"大型代码库中的符号定位与关系追踪成本较高，但图谱结果并不总能覆盖动态或间接关系。","actions":["建立精确符号与全文符号检索样本。","执行两组工具任务并记录命中、噪声和遗漏。","对方法引用、匿名函数、依赖注入、事件分发和重名符号进行失效分析。"],"decisions":["使用代码图谱进行范围收窄和批量导航。","关键结论继续用文本搜索与源码阅读做精确复核。","不把局部样本结果推广为通用效率结论。"],"verification":["符号检索在选定样本中能够缩小代码定位范围。","间接关系和重名符号场景存在漏报或噪声。","组合工作流同时保留图谱导航和文本、源码精确复核。"],"outcome":"形成以图谱收窄范围、再用文本搜索和源码阅读复核的组合工作流与保守使用边界。","limitations":["当前状态为原型评测，不公开原始项目名称、仓库规模、内部符号和源码样本。","评测结论只作定性说明，不提供精确效率指标或普遍生产力结论。","工具给出的答案质量仍需人工复核。"],"status":"PROTOTYPE","contrib":"PRIMARY","project":null,"evidenceCount":1,"claimCount":6,"evidence":[{"code":"E-05","title":"代码图谱端到端评测报告集","summary":"由部署与测评攻略、工具提效测试和端到端实战报告脱敏汇总，支持图谱导航收益、失效边界与组合复核决策。","period":"2026-05-25 → 2026-05-26","sources":3}],"questions":["代码图谱评测发现了哪些收益、失效边界和组合使用策略？","代码图谱评测用了哪些样本和任务来判断适用范围？","为什么代码图谱结果仍需要文本搜索和源码阅读进行人工复核？"]},"a-01-incident":{"code":"CASE-16","slug":"a-01-incident","type":"INCIDENT","title":"重复配置导致唯一性冲突","summary":"通过错误日志定位重复数据，清理后刷新版本并验证页面恢复。","problem":"该条目记录了「重复配置导致唯一性冲突」的公开工作摘要。","actions":["按资产库审核结果提炼公开摘要。","移除内部标识、原始代码、截图、地址和环境路径。"],"decisions":["保持原始成熟度与贡献边界，不把排查、协助或学习记录升级为独立交付。"],"verification":["来源证据状态：VERIFIED。","来源审核状态：PUBLIC_REVIEW_REQUIRED。"],"outcome":"通过错误日志定位重复数据，清理后刷新版本并验证页面恢复。","limitations":["公开内容只包含脱敏摘要，不能替代私有原始证据。","不推断未在资产库中记录的生产效果或量化收益。"],"status":"DELIVERED","contrib":"PRIMARY","project":{"slug":"activity-engineering","title":"活动系统工程实践"},"evidenceCount":1,"claimCount":1,"evidence":[{"code":"E-A-01","title":"重复配置导致唯一性冲突脱敏证据摘要","summary":"原处于待公开审核状态；本条仅公开资产库中的审核摘要、真实状态和贡献边界，原始截图、代码、内部路径与环境信息保持私有。","period":"2026-07-27 → 2026-07-27","sources":1}],"questions":["除了核心项目，你还完成了哪些任务、问题排查、研究与知识资产？"]}};

const TYPE_LABEL = { FEATURE:'功能任务', INCIDENT:'问题处理', EVALUATION:'工具评测' };
const STATUS_LABEL = { DELIVERED:'已交付', IMPLEMENTED_TESTED:'已实现并测试', PROTOTYPE:'原型验证', LEARNING:'学习整理' };
const CONTRIB_LABEL = { PRIMARY:'主要负责', COLLABORATIVE:'协作参与' };
function statusGroup(s){ return s==='DELIVERED'||s==='IMPLEMENTED_TESTED'?'delivered':(s==='PROTOTYPE'?'prototype':'learning'); }

/* 八段定义（spec §5.4），第4段 dark */
const SECTIONS = [
  {id:'problem', code:'01 / 背景', title:'问题与背景', kind:'lead'},
  {id:'actions', code:'02 / 动作', title:'采取的动作', kind:'ol', field:'actions'},
  {id:'decisions', code:'03 / 判断', title:'关键判断', kind:'ol', field:'decisions'},
  {id:'verify', code:'04 / 验证', title:'验证过程', kind:'ol', field:'verification', dark:true},
  {id:'outcome', code:'05 / 结果', title:'结果', kind:'outcome'},
  {id:'limits', code:'06 / 边界', title:'限制与边界', kind:'limits', field:'limitations'},
  {id:'evidence', code:'07 / 证据', title:'公开证据', kind:'evidence'},
  {id:'questions', code:'08 / 延伸', title:'建议问题', kind:'questions'},
];

/* ════════════════════════════════════════════════════════════════════
   渲染
   ════════════════════════════════════════════════════════════════════ */
function getCase(){
  const m = location.hash.match(/#\/cases\/([a-z0-9-]+)/i);
  const slug = m ? m[1] : 'multilingual-image-preservation';
  return { slug, data: CASES[slug] };
}

function renderBreadcrumb(c){
  return `<nav class="breadcrumb page-shell" aria-label="面包屑" style="background:var(--ink);padding-bottom:0">
    <ol class="breadcrumb__list">
      <li><a href="#/cases" style="color:var(--ink-text)">案例目录</a></li>
      <li class="breadcrumb__sep" style="color:var(--ink-text-faint)">/</li>
      <li><a href="#/cases" style="color:var(--ink-text)">${TYPE_LABEL[c.type]}</a></li>
      <li class="breadcrumb__sep" style="color:var(--ink-text-faint)">/</li>
      <li class="breadcrumb__current" style="color:var(--paper-hi)">${c.code}</li>
    </ol>
  </nav>`;
}

function renderCover(c){
  const sg = statusGroup(c.status);
  return `
    ${renderBreadcrumb(c)}
    <header class="case-cover">
      <div class="page-shell case-cover__grid">
        <div class="case-cover__code">
          <span style="color:var(--red-hi);font-family:var(--mono);font-size:10px;letter-spacing:0.14em">${c.code}</span>
          <span class="cover-status" data-sg="${sg}">
            <span class="cover-status__dot" aria-hidden="true"></span>
            ${STATUS_LABEL[c.status]}
          </span>
          <span class="cover-status cover-status--contrib">${CONTRIB_LABEL[c.contrib]}</span>
        </div>
        <div class="case-cover__copy">
          <p class="case-cover__record-type">Engineering Case Record · ${TYPE_LABEL[c.type]}</p>
          <h1 class="case-cover__title">${c.title}</h1>
          <blockquote class="case-cover__summary">${c.summary}</blockquote>
        </div>
        <div class="case-cover__meta">
          <div class="case-cover__meta-label">案卷信息</div>
          <div class="case-cover__meta-item">
            <span class="case-cover__meta-key">类型</span>
            <span class="case-cover__meta-val">${TYPE_LABEL[c.type]}</span>
          </div>
          <div class="case-cover__meta-item">
            <span class="case-cover__meta-key">关联项目</span>
            ${c.project
              ? `<span class="case-cover__meta-val"><a href="#/projects/${c.project.slug}">${c.project.title} ↗</a></span>`
              : `<span class="case-cover__meta-val case-cover__meta-val--muted">独立案例</span>`}
          </div>
          <div class="case-cover__meta-item">
            <span class="case-cover__meta-key">公开证据</span>
            <span class="case-cover__meta-val case-cover__meta-val--mono">${c.evidenceCount} APPROVED</span>
          </div>
          <div class="case-cover__meta-item">
            <span class="case-cover__meta-key">已核验断言</span>
            <span class="case-cover__meta-val case-cover__meta-val--mono">${c.claimCount} CLAIMS</span>
          </div>
        </div>
      </div>
    </header>`;
}

function renderSectionContent(sec, c){
  if(sec.kind==='lead') return `<p class="story-lead">${c.problem}</p>`;
  if(sec.kind==='ol') return `<ol>${c[sec.field].map(x=>`<li>${x}</li>`).join('')}</ol>`;
  if(sec.kind==='outcome'){
    return `<blockquote class="case-outcome">${c.outcome}</blockquote>`;
  }
  if(sec.kind==='limits'){
    return `<ul class="case-limits">${c[sec.field].map(x=>`<li>${x}</li>`).join('')}</ul>`;
  }
  if(sec.kind==='evidence'){
    if(!c.evidence || !c.evidence.length) return `<p class="case-evidence__empty">该案例当前没有已批准的公开证据。</p>`;
    return `<div class="case-evidence">${c.evidence.map(e=>`
      <div class="case-evidence__item">
        <div class="case-evidence__code">${e.code}</div>
        <div>
          <h4 class="case-evidence__title">${e.title}</h4>
          <p class="case-evidence__summary">${e.summary}</p>
          <div class="case-evidence__meta">${e.period} · ${e.sources} 个脱敏来源 · COLLECTION</div>
        </div>
      </div>`).join('')}</div>`;
  }
  if(sec.kind==='questions'){
    const qs = c.questions && c.questions.length ? c.questions : null;
    return `
      ${qs ? `<div class="case-questions">${qs.map((q,i)=>`
        <button onclick="goAsk('${c.slug}', ${JSON.stringify(q).replace(/"/g,'&quot;')})">
          <span class="case-questions__q">Q${String(i+1).padStart(2,'0')}</span>
          <span class="case-questions__text">${q}</span>
        </button>`).join('')}</div>`
      : `<p class="case-questions__empty">该案例当前没有预设的建议问题。</p>`}
      <div class="case-ask-banner">
        <div>
          <div class="case-ask-banner__title">就本案例向 Agent 提问</div>
          <div class="case-ask-banner__sub">context.source = CASE · 仅限本案例公开事实</div>
        </div>
        <button class="case-ask-banner__btn" onclick="goAsk('${c.slug}', '')">询问本案例 ↗</button>
      </div>`;
  }
  return '';
}

function renderToc(){
  return `<aside class="case-toc">
    <span class="case-toc__label">Contents</span>
    ${SECTIONS.map(s=>`<a href="#sec-${s.id}" data-toc="${s.id}"><span class="case-toc__num">${s.code.split('/')[0]}</span>${s.title}</a>`).join('')}
    <button class="case-toc__ask" onclick="goAsk('', '')">询问本案例 ↗</button>
  </aside>`;
}

function renderNotFound(slug){
  return `
    <section class="case-404 page-shell" style="padding-top:calc(var(--header-height) + 100px)">
      <div class="case-404__code">404 · CASE_NOT_FOUND</div>
      <h1 class="case-404__title">未找到该案例</h1>
      <p class="case-404__desc">slug <code style="font-family:var(--mono);color:var(--red)">${slug||'(空)'}</code> 在当前公开 Bundle 中不存在，或尚未通过公开审核。Agent 不会针对不存在的案例调用 Provider 猜测答案。</p>
      <a href="#/cases" class="case-ask-banner__btn" style="display:inline-block">← 返回案例目录</a>
    </section>`;
}

function renderFooter(){
  return `<footer class="dossier-footer">
    <div class="dossier-footer__grid">
      <div><h3>About</h3><p>这是一份求职作品集 Agent 的公开运行包。所有内容经过脱敏与人工审核，只呈现已批准的公开事实，不暴露内部代码、原始截图或生产数据。</p></div>
      <div><h3>Public Boundary</h3><p>项目与案例并列。Case 强调具体问题、判断、行动与验证。案例详情采用八段结构，与项目的五段叙事明确区分。</p></div>
      <div><h3>Privacy</h3><p>访客对话仅存于浏览器标签页内存，刷新即消失。Case→Agent 交接携带 caseSlug 与 source=CASE，清除后不隐式保留。</p></div>
    </div>
    <div class="dossier-footer__base">
      <span>VOLUME 01 · 2026-07-27.1</span>
      <span>PUBLIC · DESENSITIZED · HUMAN REVIEWED</span>
    </div>
  </footer>`;
}

function render(){
  const view = document.getElementById('view');
  const {slug, data:c} = getCase();

  if(!c){
    view.innerHTML = renderNotFound(slug) + renderFooter();
    return;
  }

  view.innerHTML = `
    ${renderCover(c)}
    <div class="case-body">
      <div class="page-shell case-body__grid">
        ${renderToc()}
        <article class="case-story">
          ${SECTIONS.map((sec,i)=>{
            const darkCls = sec.dark ? ' case-story__dark' : '';
            const mtCls = i>0 && !sec.dark ? '' : '';
            return `<section id="sec-${sec.id}" class="${mtCls}${darkCls}">
              <span class="section-code">${sec.code}</span>
              <h2>${sec.title}</h2>
              ${renderSectionContent(sec, c)}
            </section>`;
          }).join('')}
          <div class="case-next">
            <a href="#/cases">
              <span class="case-next__label">返回目录</span>
              全部案例 →
            </a>
            <a href="#/agent">
              <span class="case-next__label">完整 Agent</span>
              不带案例上下文提问 →
            </a>
          </div>
        </article>
      </div>
    </div>
    ${renderFooter()}
  `;
  initScrollSpy();
  window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}

/* TOC scrollspy */
function initScrollSpy(){
  const links = document.querySelectorAll('.case-toc a[data-toc]');
  if(!links.length) return;
  const sections = [...links].map(a=>document.getElementById('sec-'+a.dataset.toc)).filter(Boolean);
  if(!sections.length) return;
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id = e.target.id.replace('sec-','');
        links.forEach(a=>a.classList.toggle('is-active', a.dataset.toc===id));
      }
    });
  },{rootMargin:'-30% 0px -60% 0px'});
  sections.forEach(s=>obs.observe(s));
}

/* Case → Agent 交接（spec §5.5）：携带 caseSlug + source=CASE */
window.goAsk = function(caseSlug, question){
  const params = new URLSearchParams();
  if(caseSlug) params.set('case', caseSlug);
  if(question) params.set('q', question);
  location.hash = '#/agent' + (params.toString() ? '?'+params.toString() : '');
};

/* 路由 */
window.addEventListener('hashchange', render);

/* 移动端菜单 */
document.getElementById('menuTrigger').addEventListener('click', ()=>{
  const nav=document.getElementById('primaryNav');
  const btn=document.getElementById('menuTrigger');
  const open=nav.classList.toggle('is-open');
  btn.setAttribute('aria-expanded',open);
  btn.textContent=open?'关闭':'目录';
});

render();
</script>
