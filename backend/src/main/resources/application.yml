spring:
  application:
    name: portfolio-agent
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    include-message: never
    include-stacktrace: never

portfolio:
  model-runtime:
    enabled: ${PORTFOLIO_MODEL_RUNTIME_ENABLED:false}
    default-model-ref: glm-4-7-flash
    models:
      glm-4-7-flash:
        enabled: ${PORTFOLIO_GLM_ENABLED:false}
        selectable: true
        display-name: GLM-4.7-Flash
        display-order: 10
        selection-version: glm-4-7-flash-v1
        endpoint: https://open.bigmodel.cn/api/paas/v4/chat/completions
        model: glm-4.7-flash
        api-key: ${PORTFOLIO_GLM_API_KEY:}
        protocol-profile: ZHIPU_CHAT_COMPLETIONS
        data-policy-approved: ${PORTFOLIO_GLM_DATA_POLICY_APPROVED:false}
        structured-output: JSON_OBJECT
        thinking-mode: DISABLED
        streaming: false
        max-context-tokens: 200000
        max-output-tokens: 128000
      qwen-3-7-flash:
        enabled: ${PORTFOLIO_QWEN_ENABLED:false}
        selectable: true
        display-name: Qwen3.7-Flash
        display-order: 20
        selection-version: qwen-3-7-flash-v1
        endpoint: ${PORTFOLIO_QWEN_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
        model: qwen3.7-flash
        api-key: ${PORTFOLIO_QWEN_API_KEY:}
        protocol-profile: DASHSCOPE_CHAT_COMPLETIONS
        data-policy-approved: ${PORTFOLIO_QWEN_DATA_POLICY_APPROVED:false}
        structured-output: JSON_OBJECT
        thinking-mode: DISABLED
        streaming: false
        max-context-tokens: 1000000
        max-output-tokens: 128000
  model-operations:
    turn-interpretation:
      mode: ${PORTFOLIO_MODEL_OP_TURN_INTERPRETATION_MODE:DISABLED}
      schema-version: ${PORTFOLIO_MODEL_OP_TURN_INTERPRETATION_SCHEMA_VERSION:}
      max-output-tokens: ${PORTFOLIO_GOAL_INTERPRETATION_MAX_OUTPUT_TOKENS:1600}
      timeout: ${PORTFOLIO_AGENT_GOAL_INTERPRETATION_TIMEOUT:8s}
    general-knowledge:
      mode: ${PORTFOLIO_MODEL_OP_GENERAL_MODE:DISABLED}
      schema-version: ${PORTFOLIO_MODEL_OP_GENERAL_SCHEMA_VERSION:}
      max-output-tokens: ${PORTFOLIO_MODEL_MAX_OUTPUT_TOKENS:1200}
      timeout: ${PORTFOLIO_AGENT_GENERAL_KNOWLEDGE_TIMEOUT:10s}
  database:
    public:
      enabled: ${PORTFOLIO_PUBLIC_DATABASE_ENABLED:false}
      url: ${PORTFOLIO_PUBLIC_DATABASE_URL:}
      username: ${PORTFOLIO_PUBLIC_DATABASE_USERNAME:}
      password: ${PORTFOLIO_PUBLIC_DATABASE_PASSWORD:}
    governance:
      enabled: ${PORTFOLIO_GOVERNANCE_DATABASE_ENABLED:false}
      url: ${PORTFOLIO_GOVERNANCE_DATABASE_URL:}
      username: ${PORTFOLIO_GOVERNANCE_DATABASE_USERNAME:}
      password: ${PORTFOLIO_GOVERNANCE_DATABASE_PASSWORD:}
    context:
      url: ${PORTFOLIO_CONTEXT_DATABASE_URL:}
      username: ${PORTFOLIO_CONTEXT_DATABASE_USERNAME:}
      password: ${PORTFOLIO_CONTEXT_DATABASE_PASSWORD:}
      schema: ${PORTFOLIO_CONTEXT_DATABASE_SCHEMA:agent_context}
  conversation-context:
    mode: ${PORTFOLIO_CONVERSATION_CONTEXT_MODE:DISABLED}
    idle-ttl: ${PORTFOLIO_CONVERSATION_CONTEXT_IDLE_TTL:30m}
    absolute-ttl: ${PORTFOLIO_CONVERSATION_CONTEXT_ABSOLUTE_TTL:30m}
    clarification-ttl: ${PORTFOLIO_CONVERSATION_CLARIFICATION_TTL:5m}
    discussion-ttl: ${PORTFOLIO_CONVERSATION_DISCUSSION_TTL:20m}
    key-rotation-retention: ${PORTFOLIO_CONTEXT_KEY_ROTATION_RETENTION:45m}
    cleanup-interval: ${PORTFOLIO_CONVERSATION_CONTEXT_CLEANUP_INTERVAL:15m}
    cleanup-batch-size: ${PORTFOLIO_CONVERSATION_CONTEXT_CLEANUP_BATCH_SIZE:500}
    crypto:
      current-token-key-id: ${PORTFOLIO_CONTEXT_CURRENT_TOKEN_KEY_ID:}
      current-token-key: ${PORTFOLIO_CONTEXT_CURRENT_TOKEN_KEY:}
      previous-token-key-id: ${PORTFOLIO_CONTEXT_PREVIOUS_TOKEN_KEY_ID:}
      previous-token-key: ${PORTFOLIO_CONTEXT_PREVIOUS_TOKEN_KEY:}
      current-payload-key-id: ${PORTFOLIO_CONTEXT_CURRENT_PAYLOAD_KEY_ID:}
      current-payload-key: ${PORTFOLIO_CONTEXT_CURRENT_PAYLOAD_KEY:}
      previous-payload-key-id: ${PORTFOLIO_CONTEXT_PREVIOUS_PAYLOAD_KEY_ID:}
      previous-payload-key: ${PORTFOLIO_CONTEXT_PREVIOUS_PAYLOAD_KEY:}
  diagnostics:
    frontend-ingest-enabled: false
    frontend-max-batch-size: 10
    frontend-max-body-bytes: 16384
    frontend-events-per-minute: 30
  content:
    release-root: ${PORTFOLIO_CONTENT_RELEASE_ROOT:}
  retrieval:
    profile: ${PORTFOLIO_RETRIEVAL_PROFILE:DISABLED}
    model-directory: ${PORTFOLIO_RETRIEVAL_MODEL_DIR:}
  agent-runtime:
    requests-per-minute: ${PORTFOLIO_AGENT_REQUESTS_PER_MINUTE:10}
    max-concurrent-per-source: ${PORTFOLIO_AGENT_MAX_CONCURRENT_PER_SOURCE:2}
    max-active-turns: ${PORTFOLIO_AGENT_MAX_ACTIVE_TURNS:8}
    max-tracked-sources: ${PORTFOLIO_AGENT_MAX_TRACKED_SOURCES:10000}
    lease-duration: ${PORTFOLIO_AGENT_LEASE_DURATION:35s}
    turn-timeout: ${PORTFOLIO_AGENT_TURN_TIMEOUT:20s}
    settlement-reserve: ${PORTFOLIO_AGENT_SETTLEMENT_RESERVE:2s}
    database-operation-timeout: ${PORTFOLIO_AGENT_DATABASE_OPERATION_TIMEOUT:3s}
    trust-proxy: ${PORTFOLIO_AGENT_TRUST_PROXY:false}
    trusted-proxies: ${PORTFOLIO_AGENT_TRUSTED_PROXIES:}
