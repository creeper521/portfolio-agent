spring:
  application:
    name: portfolio-agent
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    include-message: never
    include-stacktrace: never

portfolio:
  database:
    public:
      enabled: ${PORTFOLIO_PUBLIC_DATABASE_ENABLED:false}
      url: ${PORTFOLIO_PUBLIC_DATABASE_URL:}
      username: ${PORTFOLIO_PUBLIC_DATABASE_USERNAME:}
      password: ${PORTFOLIO_PUBLIC_DATABASE_PASSWORD:}
    governance:
      enabled: ${PORTFOLIO_GOVERNANCE_DATABASE_ENABLED:false}
      url: ${PORTFOLIO_GOVERNANCE_DATABASE_URL:}
      username: ${PORTFOLIO_GOVERNANCE_DATABASE_USERNAME:}
      password: ${PORTFOLIO_GOVERNANCE_DATABASE_PASSWORD:}
    context:
      url: ${PORTFOLIO_CONTEXT_DATABASE_URL:}
      username: ${PORTFOLIO_CONTEXT_DATABASE_USERNAME:}
      password: ${PORTFOLIO_CONTEXT_DATABASE_PASSWORD:}
      schema: ${PORTFOLIO_CONTEXT_DATABASE_SCHEMA:agent_context}
  conversation-context:
    mode: ${PORTFOLIO_CONVERSATION_CONTEXT_MODE:DISABLED}
    idle-ttl: ${PORTFOLIO_CONVERSATION_CONTEXT_IDLE_TTL:24h}
    absolute-ttl: ${PORTFOLIO_CONVERSATION_CONTEXT_ABSOLUTE_TTL:7d}
    cleanup-interval: ${PORTFOLIO_CONVERSATION_CONTEXT_CLEANUP_INTERVAL:15m}
    cleanup-batch-size: ${PORTFOLIO_CONVERSATION_CONTEXT_CLEANUP_BATCH_SIZE:500}
    crypto:
      current-token-key-id: ${PORTFOLIO_CONTEXT_CURRENT_TOKEN_KEY_ID:}
      current-token-key: ${PORTFOLIO_CONTEXT_CURRENT_TOKEN_KEY:}
      previous-token-key-id: ${PORTFOLIO_CONTEXT_PREVIOUS_TOKEN_KEY_ID:}
      previous-token-key: ${PORTFOLIO_CONTEXT_PREVIOUS_TOKEN_KEY:}
      current-payload-key-id: ${PORTFOLIO_CONTEXT_CURRENT_PAYLOAD_KEY_ID:}
      current-payload-key: ${PORTFOLIO_CONTEXT_CURRENT_PAYLOAD_KEY:}
      previous-payload-key-id: ${PORTFOLIO_CONTEXT_PREVIOUS_PAYLOAD_KEY_ID:}
      previous-payload-key: ${PORTFOLIO_CONTEXT_PREVIOUS_PAYLOAD_KEY:}
  diagnostics:
    frontend-ingest-enabled: false
    frontend-max-batch-size: 10
    frontend-max-body-bytes: 16384
    frontend-events-per-minute: 30
  content:
    release-root: ${PORTFOLIO_CONTENT_RELEASE_ROOT:}
  retrieval:
    profile: ${PORTFOLIO_RETRIEVAL_PROFILE:DISABLED}
    model-directory: ${PORTFOLIO_RETRIEVAL_MODEL_DIR:}
  model-expression:
    enabled: ${PORTFOLIO_MODEL_EXPRESSION_ENABLED:false}
    provider: ${PORTFOLIO_MODEL_PROVIDER:DEEPSEEK_V4_FLASH}
    policy-version: ${PORTFOLIO_MODEL_EXPRESSION_POLICY_VERSION:p4-expression-policy-v1}
    input-schema-version: ${PORTFOLIO_MODEL_EXPRESSION_INPUT_SCHEMA_VERSION:portfolio-expression-input.v1}
    draft-schema-version: ${PORTFOLIO_MODEL_EXPRESSION_DRAFT_SCHEMA_VERSION:portfolio-expression-draft.v1}
    allowed-material-kinds: [FACT]
    max-output-tokens: ${PORTFOLIO_MODEL_EXPRESSION_MAX_OUTPUT_TOKENS:1600}
    timeout: ${PORTFOLIO_MODEL_EXPRESSION_TIMEOUT:4s}
    external-public-data-policy-approved: ${PORTFOLIO_MODEL_EXPRESSION_PUBLIC_DATA_POLICY_APPROVED:false}
    deepseek-api-key: ${PORTFOLIO_AGENT_DEEPSEEK_API_KEY:}
    glm-api-key: ${PORTFOLIO_AGENT_GLM_API_KEY:}
  conversational-model:
    enabled: ${PORTFOLIO_MODEL_ENABLED:false}
    provider: ${PORTFOLIO_MODEL_PROVIDER:DEEPSEEK_V4_FLASH}
    model-policy-version: ${PORTFOLIO_MODEL_POLICY_VERSION:c1-policy-v1}
    answer-schema-version: c1.answer.v1
    timeout: ${PORTFOLIO_MODEL_TIMEOUT:8s}
    max-tokens: ${PORTFOLIO_MODEL_MAX_TOKENS:1200}
    max-model-attempts: 1
    external-data-policy-approved: ${PORTFOLIO_MODEL_DATA_POLICY_APPROVED:false}
    deepseek-api-key: ${PORTFOLIO_AGENT_DEEPSEEK_API_KEY:}
    glm-api-key: ${PORTFOLIO_AGENT_GLM_API_KEY:}
  conversational-agent:
    enabled: ${PORTFOLIO_CONVERSATIONAL_AGENT_ENABLED:false}
    visitor-data-policy-approved: ${PORTFOLIO_VISITOR_MODEL_DATA_POLICY_APPROVED:false}
    semantic-classifier-enabled: ${PORTFOLIO_SEMANTIC_CLASSIFIER_ENABLED:false}
    max-history-rounds: 20
    recent-raw-rounds: 6
    max-input-tokens: ${PORTFOLIO_CONVERSATION_MAX_INPUT_TOKENS:12000}
    max-suggested-questions: 3
    minimum-intent-confidence: 0.65
  answer-production:
    requests-per-minute: ${PORTFOLIO_ANSWER_REQUESTS_PER_MINUTE:10}
    max-concurrent: ${PORTFOLIO_ANSWER_MAX_CONCURRENT:2}
    request-timeout: ${PORTFOLIO_ANSWER_REQUEST_TIMEOUT:12s}
    idempotency-ttl: ${PORTFOLIO_ANSWER_IDEMPOTENCY_TTL:2m}
    trust-proxy: ${PORTFOLIO_ANSWER_TRUST_PROXY:false}
    trusted-proxies: ${PORTFOLIO_ANSWER_TRUSTED_PROXIES:}
