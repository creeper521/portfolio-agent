portfolio:
  conversation-context:
    mode: ${PORTFOLIO_CONVERSATION_CONTEXT_MODE:POSTGRESQL}
  diagnostics:
    frontend-ingest-enabled: ${PORTFOLIO_FRONTEND_DIAGNOSTICS_ENABLED:false}

logging:
  structured:
    format:
      console: ecs
    json:
      add:
        deployment.environment: production
  level:
    root: INFO
    com.portfolio.agent: INFO
    org.springframework.web: WARN
    org.springframework.web.client: WARN
