logging:
  level:
    com.portfolio.agent: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %replace(%kvp){'\"', ''}%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
